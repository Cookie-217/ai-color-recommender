services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-colorai}
      POSTGRES_USER: ${DB_USERNAME:-colorai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-colorai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-colorai}
      DB_USERNAME: ${DB_USERNAME:-colorai}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
      # ⚠️ 务必修改为你自己的长随机字符串（≥32 字节），切勿使用默认值或提交到仓库
      APP_JWT_SECRET: ${APP_JWT_SECRET:-please-change-me-to-a-long-random-secret-string}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
