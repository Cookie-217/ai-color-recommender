server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ai-color-recommender
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:colorai;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL:update}
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

app:
  jwt:
    # 生产环境务必通过环境变量 APP_JWT_SECRET 注入（≥32 字节），勿写死在代码中
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION:86400000}
  cors:
    # 允许的前端来源，多个用逗号分隔；开发期可用 * （已含凭证时会被降级为具体来源）
    allowed-origins: ${APP_CORS_ORIGINS:*}
  llm:
    enabled: ${APP_LLM_ENABLED:false}
    base-url: ${APP_LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${APP_LLM_API_KEY:}
    model: ${APP_LLM_MODEL:gpt-4o-mini}
    timeout-ms: ${APP_LLM_TIMEOUT:8000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
