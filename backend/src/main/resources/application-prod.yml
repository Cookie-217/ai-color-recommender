spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/colorai}
    username: ${DB_USERNAME:colorai}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL:update}

app:
  cors:
    # 生产环境请改为真实前端域名，例如 https://your-domain.com
    allowed-origins: ${APP_CORS_ORIGINS:https://your-frontend.example.com}
